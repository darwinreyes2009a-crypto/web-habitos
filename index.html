  return st === 'online';                            // loggedout u offline → pantalla de cuenta
}
function authScreen() {
  const st = DailySync.status.state;
  const wrap = h('div', { class: 'center-page' }, h('div', { class: 'center-box' }));
  const box = wrap.firstChild;
  box.append(h('div', { class: 'auth-logo', html: 'D' }), h('h2', { style: 'font-size:24px;font-weight:800;letter-spacing:-.03em' }, 'Bienvenido a DailyHub'));
  if (st === 'offline') {
    box.append(
      h('p', { style: 'font-size:13.5px;color:var(--text-2);margin:8px 0 20px;line-height:1.6' }, 'No hay conexión con el servidor. Puedes usar la app con los datos guardados en este dispositivo.'),
      h('button', { class: 'btn btn-primary btn-block btn-lg', onclick: () => { DailySync.status.state = 'loggedout'; render(); } }, 'Continuar sin conexión'),
      h('button', { class: 'btn btn-soft btn-block', style: 'margin-top:10px', onclick: () => { DailySync.status.state = 'loading'; render(); DailySync.boot(); } }, 'Reintentar')
    );
    return wrap;
  }
  const emailIn = h('input', { class: 'input', type: 'email', placeholder: 'tucorreo@ejemplo.com', autocomplete: 'email' });
  const passIn = h('input', { class: 'input', type: 'password', placeholder: 'Mínimo 6 caracteres', autocomplete: 'current-password' });
  const msg = h('p', { class: 'field-hint', style: 'min-height:18px;text-align:center' });
  const btn = h('button', { class: 'btn btn-primary btn-block btn-lg' }, 'Entrar');
  let mode = 'login';
  const modeBtn = h('button', { class: 'link', style: 'font-size:13px;margin-top:18px' }, '¿No tienes cuenta? Crear una');
  modeBtn.addEventListener('click', () => {
    mode = mode === 'login' ? 'signup' : 'login';
    btn.textContent = mode === 'login' ? 'Entrar' : 'Crear cuenta';
    modeBtn.textContent = mode === 'login' ? '¿No tienes cuenta? Crear una' : 'Ya tengo cuenta · Entrar';
    msg.textContent = '';
  });
  async function submit() {
    const email = emailIn.value.trim(), pass = passIn.value;
    if (!email || !pass) { msg.textContent = 'Escribe tu email y contraseña.'; return; }
    btn.disabled = true; msg.textContent = 'Un momento…';
    try {
      const r = mode === 'login'
        ? await window.sb.auth.signInWithPassword({ email, password: pass })
        : await window.sb.auth.signUp({ email, password: pass });
      if (r.error) throw r.error;
      if (mode === 'signup' && !r.data.session) {
        msg.style.color = 'var(--primary)';
        msg.textContent = 'Cuenta creada. Revisa tu correo para confirmarla y luego entra.';
        btn.disabled = false; mode = 'login'; btn.textContent = 'Entrar';
        return;
      }
      DailySync.status.state = 'online';
      S.meta.localMode = false;
      msg.style.color = ''; msg.textContent = '';
      const okPull = await DailySync.pull();
      render();
      if (!okPull) toast('Conectado, pero la nube no responde. ¿Aplicaste supabase/schema.sql en Supabase?');
    } catch (e) {
      msg.style.color = 'var(--danger)';
      msg.textContent = e.message === 'Invalid login credentials' ? 'Email o contraseña incorrectos.' : (e.message || 'Error de conexión');
      btn.disabled = false;
    }
  }
  btn.addEventListener('click', submit);
  passIn.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  emailIn.addEventListener('keydown', e => { if (e.key === 'Enter') passIn.focus(); });
  box.append(
    h('div', { class: 'field', style: 'text-align:left;margin-top:20px' }, h('label', null, 'Email'), emailIn),
    h('div', { class: 'field', style: 'text-align:left' }, h('label', null, 'Contraseña'), passIn),
    msg, btn, modeBtn,
    h('button', { class: 'link', style: 'font-size:12px;margin-top:8px;color:var(--text-3)', onclick: () => { DailySync.status.state = 'loggedout'; S.meta.localMode = true; save(); render(); } }, 'Usar solo este dispositivo (sin cuenta)')
  );
  return wrap;
}

            h('div', { class: 'auth-logo', style: 'width:48px;height:48px;font-size:20px;margin-bottom:10px', html: (user.email || '?').charAt(0).toUpperCase() }),
            h('b', { style: 'font-size:15px;display:block' }, user.email),
            h('p', { style: 'font-size:12px;color:var(--text-2);margin-top:4px' }, 'Tus datos se sincronizan en todos tus dispositivos')
          ),
          h('button', { class: 'btn btn-soft btn-block', onclick: async () => { toast('Sincronizando…'); const ok = await DailySync.push(); toast(ok ? 'Todo sincronizado ✓' : 'No se pudo sincronizar'); } }, 'Sincronizar ahora'),
          h('button', { class: 'btn btn-soft btn-block', style: 'margin-top:10px', onclick: async () => { toast('Descargando…'); const ok = await DailySync.pull(); toast(ok ? 'Datos actualizados ✓' : 'No se pudo descargar'); if (ok) render(); } }, 'Descargar cambios del servidor'),
          h('button', { class: 'btn btn-danger btn-block btn-lg', style: 'margin-top:18px', onclick: () => confirmDialog({
            title: '¿Cerrar sesión?',
            message: 'Los datos de este dispositivo se guardarán y podrás verlos sin conexión. Podrás volver a entrar cuando quieras.',
            confirmText: 'Cerrar sesión',
            onConfirm: async () => { await window.sb.auth.signOut(); DailySync.status.state = 'loggedout'; session.unlocked = false; closeOverlays(); render(); toast('Sesión cerrada'); }
          }) }, 'Cerrar sesión'),
          h('p', { style: 'font-size:11px;color:var(--text-3);margin-top:14px;text-align:center' }, 'Copia local: ' + Math.round(local / 1024) + ' KB')
        );
      } else {
        box.append(
          h('p', { style: 'font-size:13.5px;color:var(--text-2);text-align:center;line-height:1.6;margin-bottom:16px' }, 'Estás usando DailyHub sin cuenta: los datos solo están en este navegador. Crea una cuenta para tenerlos en todos tus dispositivos.'),
          h('button', { class: 'btn btn-primary btn-block btn-lg', onclick: () => { S.meta.localMode = false; DailySync.status.state = 'loggedout'; save(); closeOverlays(); render(); } }, 'Crear cuenta o iniciar sesión')
        );
      }
    });
    return box;
  });
}

/* ---------- confirmación al salir de la PWA ---------- */
(function () {
  let armed = true;
  // Interruptor interno (p. ej. para recargas programadas o flujos internos):
  window.__armExitGuard = (v) => { armed = !!v; };
  // 1) Cerrar/recargar pestaña: aviso nativo del navegador
  window.addEventListener('beforeunload', (e) => {
    if (!armed) return;
    e.preventDefault();
    e.returnValue = '¿Seguro que quieres salir de DailyHub?';
    return e.returnValue;
  });
  // 2) Botón atrás del navegador / gesto atrás en PWA instalada
  history.pushState({ dh: 1 }, '', location.href);
  window.addEventListener('popstate', () => {
    if (!armed) return;
    history.pushState({ dh: 1 }, '', location.href); // mantenemos la PWA en su sitio mientras decidimos
    if ($('#overlays').children.length) { closeOverlays(); return; }
    if (routeStack.length) { goBack(); return; }
    exitDialog();
  });
})();

/* ---------- arranque ---------- */
if (('serviceWorker' in navigator) && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
render();
if (window.DailySync) DailySync.boot();
maybeNotify();
scheduleGiftNotification();
startNotificationChecks();
window.addEventListener('focus', () => { maybeNotify(); scheduleGiftNotification(); });
</script>
</body>
